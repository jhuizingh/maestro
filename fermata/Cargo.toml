[package]
name = "fermata"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false }
hyper = { version = "1.13.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
libc = "0.2.191"
notify = "8.2.2"
open = "5.4.5"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "signal"] }

[build-dependencies]
chrono = "0.4.45"
